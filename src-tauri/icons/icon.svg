<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00897B"/>
      <stop offset="1" stop-color="#004D40"/>
    </linearGradient>
    <linearGradient id="bdy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3A42"/>
      <stop offset="1" stop-color="#141C21"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#00352E" stroke-width="8"/>

  <!-- chef hat -->
  <g>
    <circle cx="205" cy="118" r="46" fill="#FAFAFA"/>
    <circle cx="307" cy="118" r="46" fill="#FAFAFA"/>
    <rect x="180" y="120" width="152" height="66" rx="18" fill="#FAFAFA"/>
    <rect x="192" y="186" width="128" height="22" rx="10" fill="#ECEFF1"/>
  </g>

  <!-- head -->
  <ellipse cx="256" cy="252" rx="118" ry="104" fill="url(#bdy)"/>
  <!-- face patch -->
  <ellipse cx="256" cy="272" rx="78" ry="70" fill="#FFF8E1"/>

  <!-- eyes -->
  <circle cx="222" cy="252" r="13" fill="#1B1B1B"/>
  <circle cx="290" cy="252" r="13" fill="#1B1B1B"/>
  <circle cx="226" cy="248" r="4.5" fill="#FFFFFF"/>
  <circle cx="294" cy="248" r="4.5" fill="#FFFFFF"/>

  <!-- beak -->
  <path d="M 236 292 Q 256 306 276 292 Q 266 316 256 316 Q 246 316 236 292 Z" fill="#FF8F00"/>

  <!-- spatula -->
  <g transform="rotate(38 356 260)">
    <rect x="348" y="270" width="14" height="130" rx="7" fill="#5D4037"/>
    <rect x="332" y="196" width="46" height="78" rx="14" fill="#B0BEC5"/>
    <rect x="332" y="258" width="46" height="12" rx="6" fill="#90A4AE"/>
  </g>

  <!-- wing / arm holding spatula -->
  <path d="M 338 292 Q 352 268 362 272 Q 372 276 352 300 Q 344 310 334 300 Z" fill="#1C262B"/>

  <!-- belly -->
  <ellipse cx="256" cy="392" rx="88" ry="70" fill="#FFF8E1"/>
  <!-- feet -->
  <path d="M 196 442 Q 196 462 222 462 L 244 462 Q 252 462 252 450 L 252 436 L 196 436 Z" fill="#FF8F00"/>
  <path d="M 316 442 Q 316 462 290 462 L 268 462 Q 260 462 260 450 L 260 436 L 316 436 Z" fill="#FF8F00"/>
</svg>
