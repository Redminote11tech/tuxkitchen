<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#241f2e"/>
      <stop offset="1" stop-color="#15121b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d0bcff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d0bcff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4a56"/>
      <stop offset="1" stop-color="#232c34"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43535f"/>
      <stop offset="1" stop-color="#2c3742"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#e9e2d4"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)"/>
  <circle cx="256" cy="210" r="190" fill="url(#glow)"/>
  <rect x="21" y="21" width="470" height="470" rx="103" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="5"/>

  <!-- penguin head, peeking over the pot rim -->
  <circle cx="256" cy="212" r="112" fill="url(#head)" stroke="#5a6b79" stroke-width="7"/>
  <ellipse cx="256" cy="238" rx="80" ry="70" fill="url(#face)"/>

  <!-- eyes -->
  <circle cx="221" cy="216" r="19" fill="#ffffff"/>
  <circle cx="291" cy="216" r="19" fill="#ffffff"/>
  <circle cx="224" cy="219" r="10" fill="#141a1f"/>
  <circle cx="288" cy="219" r="10" fill="#141a1f"/>
  <circle cx="227" cy="215" r="3.4" fill="#ffffff"/>
  <circle cx="291" cy="215" r="3.4" fill="#ffffff"/>

  <!-- beak -->
  <path d="M 231 256 Q 256 272 281 256 Q 274 292 256 292 Q 238 292 231 256 Z" fill="#ff8f00"/>
  <path d="M 247 268 Q 256 273 265 268 Q 260 282 256 282 Q 252 282 247 268 Z" fill="#e65100"/>

  <!-- chef toque: puffy top + band -->
  <g>
    <circle cx="212" cy="106" r="42" fill="#fafafa"/>
    <circle cx="256" cy="92" r="52" fill="#fafafa"/>
    <circle cx="300" cy="106" r="42" fill="#fafafa"/>
    <rect x="176" y="98" width="160" height="74" rx="18" fill="#fafafa"/>
    <rect x="184" y="150" width="144" height="30" rx="15" fill="#b69df8"/>
  </g>

  <!-- cooking pot -->
  <rect x="104" y="288" width="304" height="140" rx="34" fill="url(#pot)"/>
  <rect x="88" y="272" width="336" height="52" rx="26" fill="#4a5968"/>
  <rect x="104" y="282" width="304" height="16" rx="8" fill="#5b6b7b"/>

  <!-- flippers resting on the rim -->
  <path d="M 118 296 Q 92 284 88 308 Q 85 328 116 331 Q 138 333 140 316 Q 141 302 118 296 Z" fill="#3d4c59"/>
  <path d="M 394 296 Q 420 284 424 308 Q 427 328 396 331 Q 374 333 372 316 Q 371 302 394 296 Z" fill="#3d4c59"/>

  <!-- tile edge shadow under pot -->
  <rect x="130" y="420" width="252" height="10" rx="5" fill="#000000" fill-opacity="0.25"/>
</svg>
